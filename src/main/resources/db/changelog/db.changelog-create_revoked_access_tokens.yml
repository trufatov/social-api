databaseChangeLog:
  - changeSet:
      id: 007-create-revoked-access-tokens
      author: tamer

      changes:
        - createTable:
            tableName: revoked_access_tokens

            columns:
              - column:
                  name: jti
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: revoked_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: revoked_access_tokens
            indexName: idx_revoked_access_tokens_expires_at
            columns:
              - column:
                  name: expires_at
