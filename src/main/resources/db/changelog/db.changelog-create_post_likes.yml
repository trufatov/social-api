databaseChangeLog:
  - changeSet:
      id: 003-create-post-likes
      author: tamer

      changes:
        - createTable:
            tableName: post_likes

            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: post_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: post_likes
            baseColumnNames: user_id

            referencedTableName: users
            referencedColumnNames: id

            constraintName: fk_like_user

        - addForeignKeyConstraint:
            baseTableName: post_likes
            baseColumnNames: post_id

            referencedTableName: posts
            referencedColumnNames: id

            constraintName: fk_like_post

        - addUniqueConstraint:
            tableName: post_likes
            columnNames: user_id, post_id
            constraintName: uk_user_post_like