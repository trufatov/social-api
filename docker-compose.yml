services:
  db:
    image: postgres:18-alpine
    container_name: social-api-db
    environment:
      POSTGRES_DB: social_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: social-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/social_api
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: change-me-in-production-use-long-random-string
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_AUTH_COOKIE_SECURE: "false"
      APP_AUTH_COOKIE_SAME_SITE: Lax
      APP_UPLOAD_PROFILE_PICTURES_DIR: /app/uploads/profile-pictures
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
